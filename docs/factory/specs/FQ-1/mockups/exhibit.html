<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>DUN · 三角龙展品产品草图</title>
  </head>
  <body>
    <header>
      <p>DUN · 史前动物博物馆</p>
      <a href="#">← 回到博物馆入口</a>
    </header>
    <main>
      <section>
        <p>今天只认识一位新朋友</p>
        <h1>三角龙 <small>Triceratops</small></h1>
        <figure>
          <div aria-label="一只平静站立的三角龙场景">[三角龙原创场景]</div>
          <figcaption>先别急着读。你们最先看到了什么？</figcaption>
        </figure>
      </section>
      <section aria-labelledby="look-together">
        <h2 id="look-together">一起看一看</h2>
        <button type="button">你看到了哪些形状？</button>
        <button type="button">它的身体哪里最特别？</button>
        <button type="button">如果能问它一个问题，你会问什么？</button>
        <aside>
          <h3>给大人的话</h3>
          <p>不用立刻告诉孩子答案。先听听孩子怎么说。</p>
        </aside>
      </section>
      <section aria-labelledby="take-away">
        <h2 id="take-away">带着一个问题离开</h2>
        <p>到户外找一找：什么东西也有保护自己的形状？</p>
        <a href="#">参观结束，回到入口</a>
      </section>
    </main>
  </body>
</html>

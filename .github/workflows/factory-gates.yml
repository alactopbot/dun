name: Factory Gates

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: factory-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  factory-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ./.claude/scripts/gates.sh deep
